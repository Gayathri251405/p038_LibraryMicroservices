server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: book-service
          uri: lb://BOOK-SERVICE
          predicates:
            - Path=/api/books/**
        - id: circulation-service
          uri: lb://BOOK-SERVICE
          predicates:
            - Path=/api/circulation/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-before-deployment-32bytes}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
