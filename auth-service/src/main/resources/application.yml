server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library}
    username: ${SPRING_DATASOURCE_USERNAME:library}
    password: ${SPRING_DATASOURCE_PASSWORD:library}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-before-deployment-32bytes}
    expiration: ${JWT_EXPIRATION:PT1H}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin12345!}
  librarian:
    username: ${LIBRARIAN_USERNAME:librarian}
    password: ${LIBRARIAN_PASSWORD:Librarian123!}
management:
  endpoints:
    web:
      exposure:
        include: health,info
